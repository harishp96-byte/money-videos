# Puppet show: voices (Kokoro, free) + puppet animation render, all on GitHub's
# free machines. Starts by itself when a show or the show renderer changes, or
# tap Actions -> "Puppet show" -> "Run workflow" on your phone.
# The finished MP4 is saved on the "previews-show" branch (and as a download).
name: Puppet show

on:
  push:
    paths:
      - "shows/**"
      - "pipeline/puppet_show.py"
      - "pipeline/tts_show.py"
      - ".github/workflows/puppet-show.yml"
  workflow_dispatch:
    inputs:
      show:
        description: "Show folder under shows/ (blank = newest)"
        required: false
        default: ""

concurrency:
  group: puppet-show
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Cache the voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9.4" soundfile pyyaml numpy pillow opencv-python-headless
      - name: Pick the show
        id: p
        run: |
          S="${{ github.event.inputs.show }}"
          if [ -z "$S" ]; then S=$(ls shows | sort | tail -1); fi
          echo "show=$S" >> "$GITHUB_OUTPUT"
      - name: Voices
        run: |
          mkdir -p out/show
          set -o pipefail
          python pipeline/tts_show.py "shows/${{ steps.p.outputs.show }}" 2>&1 | tee out/show/log.txt
      - name: Render
        run: |
          set -o pipefail
          python pipeline/puppet_show.py "shows/${{ steps.p.outputs.show }}" 2>&1 | tee -a out/show/log.txt
      - uses: actions/upload-artifact@v4
        with:
          name: show-${{ steps.p.outputs.show }}
          path: out/show/${{ steps.p.outputs.show }}.mp4
          retention-days: 14
      - name: Save preview copy
        if: always()
        run: |
          mkdir -p /tmp/p
          cp out/show/*.mp4 /tmp/p/ 2>/dev/null || true
          rm -f /tmp/p/_video.mp4
          cp out/show/voice.json out/show/log.txt /tmp/p/ 2>/dev/null || true
          cd /tmp/p
          git init -q -b previews-show
          git config user.name "render-bot"; git config user.email "render-bot@users.noreply.github.com"
          git add . && git commit -q -m "Show ${{ steps.p.outputs.show }} (${GITHUB_SHA::7}) ${{ job.status }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews-show
